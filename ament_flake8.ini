[flake8]
# Keep the ROS 2 Jazzy exclusions and add E203 for Ruff's Black-compatible slice spacing.
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,E203,I202
exclude =
    tests/test_debug_robot_description_topic.py,
    tests/test_debug_scripts.py,
    tests/test_debug_spawn_sequence.py,
    tests/test_launch_contract.py,
    tests/test_launch_smoke.py,
    tests/test_model_xacro_args_contract.py,
    tests/test_real_params_rendering.py,
    tests/test_xacro_expansion.py
# Classify this package as application code so Flake8 and Ruff use the same section.
application-import-names = conftest,robot_rbvogui_common
import-order-style = google
max-line-length = 99
show-source = true
statistics = true
