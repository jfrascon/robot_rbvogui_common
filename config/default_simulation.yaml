# This file shows the full simulation configuration for the `base` model of the `rbvogui` robot.
# If you need to customize the simulation configuration, create a new file and pass it as a value
# for the parameter 'sim_file' in the used launch file.

# Parameters for a basic functional battery:
# - `voltage` is the initial battery voltage in volts.
# - `capacity` is the total charge that the battery can hold in ampere-hours.
# - `power_load` is the battery power load in watts.
# - `fix_issue_225` enables Gazebo's corrected battery state-of-charge behavior.
#   With this flag set:
#     battery_runtime_hours = capacity_Ah * voltage_V / power_load_W
#   With this flag unset:
#     battery_runtime_hours = capacity_Ah * voltage_V / (power_load_W * 100)
#
# Ideal battery with no discharge:
# - To publish battery state while keeping an ideal infinite battery, set `power_load` to `0.0`.
#   The plugin then publishes the state while the stored charge remains constant.
# - Keep `voltage` positive. The plugin computes current from power divided by voltage.
#
# Parameters for a more realistic battery:
# Use the basic parameters above and add any of the following fields when needed.
# - `open_circuit_voltage_constant_coef` is the voltage at full charge in volts. If omitted, the
#   macro uses the same value as `voltage`.
# - `open_circuit_voltage_linear_coef` is the voltage decrease when the battery has no charge.
# - `initial_charge` is the initial charge in ampere-hours.
# - `resistance` is the internal resistance in ohms.
# - `smooth_current_tau` is the current smoothing coefficient.
# - `invert_current_sign` flips the current sign reported in the battery state message.
# - `start_draining` starts power draining when the simulation begins.
# - `power_draining_topic` starts power draining when it receives a message.
# - `stop_power_draining_topic` stops power draining when it receives a message.
#
# Charging:
# - `enable_recharge` enables battery recharging.
# - `charging_time` is the number of hours needed to fully charge the battery with no load.
# - When `recharge_by_topic` is true, the plugin subscribes to Gazebo Transport topics that start
#   and stop recharge.
# - Gazebo exposes recharge services at these paths when recharge is enabled:
#   `/model/<model_name>/battery/main_battery/recharge/start`
#   `/model/<model_name>/battery/main_battery/recharge/stop`
#
# Gazebo publishes the battery state at:
# `/model/<model_name>/battery/main_battery/state`
# `launch/bridge.launch.py` forwards it to `main_battery/state` in the robot ROS namespace.
battery:
  enabled: true
  voltage: 24.0
  capacity: 20.0
  power_load: 0.0
  fix_issue_225: true

# Plugin to control the mobile base in velocity.
base_velocity_controller:
  enabled: true
  topic: cmd_vel
  initial_linear_vel: {"x": 0.0, "y": 0.0, "z": 0.0}
  initial_angular_vel: {"x": 0.0, "y": 0.0, "z": 0.0}

# Wheel-ground contact configuration. The four blocks preserve the logical order expected by
# ground_vehicle_kinematics: front-left, front-right, rear-left, rear-right.
front_left_wheel:
  enabled: true
  max_contacts: 1
  mu: 0.05
  mu2: 0.5
  slip1: 0.005
  slip2: 0.0005

front_right_wheel:
  enabled: true
  max_contacts: 1
  mu: 0.05
  mu2: 0.5
  slip1: 0.005
  slip2: 0.0005

rear_left_wheel:
  enabled: true
  max_contacts: 1
  mu: 0.05
  mu2: 0.5
  slip1: 0.005
  slip2: 0.0005

rear_right_wheel:
  enabled: true
  max_contacts: 1
  mu: 0.05
  mu2: 0.5
  slip1: 0.005
  slip2: 0.0005

pose_publisher:
  enabled: true
  reference_frame: map
  local_offset: {"x": 0.0, "y": 0.0, "z": 0.0, "R": 0.0, "P": 0.0, "Y": 0.0}
  global_offset: {"x": 0.0, "y": 0.0, "z": 0.0, "R": 0.0, "P": 0.0, "Y": 0.0}
  gaussian_noise: 0.0
  msg_publication_freq: 50.0
  topic: base_pose_ground_truth_no_cov # published
  topic_with_covariance: base_pose_ground_truth # published
  tf_topic: tf_sim_world_fr_robot_root_fr # published

# Steering controller indices 0 through 3 map to front-left, front-right, rear-left and
# rear-right, in that order.
front_left_wheel_steering_joint_controller:
  enabled: true
  initial_angle: 0.0
  topic: joint_commands/base # received

front_right_wheel_steering_joint_controller:
  enabled: true
  initial_angle: 0.0
  topic: joint_commands/base # received

rear_left_wheel_steering_joint_controller:
  enabled: true
  initial_angle: 0.0
  topic: joint_commands/base # received

rear_right_wheel_steering_joint_controller:
  enabled: true
  initial_angle: 0.0
  topic: joint_commands/base # received

# Plugin to control the rotation of the steerable wheels.
# It has visual purposes only, since the motion of the platform is controlled by
# the base_velocity_controller.
# If disabled, the wheels will not rotate visually, but the platform will still
# move correctly.
front_left_wheel_rotation_joint_controller:
  enabled: true
  topic: joint_commands/base # received

front_right_wheel_rotation_joint_controller:
  enabled: true
  topic: joint_commands/base # received

rear_left_wheel_rotation_joint_controller:
  enabled: true
  topic: joint_commands/base # received

rear_right_wheel_rotation_joint_controller:
  enabled: true
  topic: joint_commands/base # received

# Plugin to publish the joint states of the robot.
joint_state_publisher:
  enabled: true
  topic: joint_states # published
