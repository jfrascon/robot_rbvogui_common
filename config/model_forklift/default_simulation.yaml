    mean_z: 0.0000075
    stddev_z: 8e-7
  ang_vel_gaussian_noise_dynamic_bias:
    stddev_x: 0.0
    corr_time_x: 0.0
    stddev_y: 0.0
    corr_time_y: 0.0
    stddev_z: 0.0
    corr_time_z: 0.0
  lin_acc_gaussian_noise:
    mean_x: 0.0
    stddev_x: 0.017
