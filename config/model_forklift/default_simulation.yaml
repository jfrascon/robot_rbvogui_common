################################################################################
# Front top LiDAR is a Robosense Airy with integrated IMU.
################################################################################
# Configuration for the `gpu_lidar` Gazebo plugin.
front_top_lidar:
  enabled: true
  always_on: true
  visualize: false
  update_rate: 10.0
  hor_fov_deg: {"min_angle": -180, "max_angle": 180}
  hor_res_deg: 0.4
  ver_fov_deg: {"min_angle": 0, "max_angle": 90}
  ver_res_deg: 0.947
  dist_span: {"min_dist": 0.1, "max_dist": 60}   # m
  gaussian_noise: {"mean": 0, "stddev": 0.01}
  # The Gazebo plugin will publish two topics:
  # Topic <base_topic> with messages of type gz.msgs.LaserScan
  # Topic <base_topic>/points with messages of type gz.msgs.PointCloudPacked
  base_topic: front_top_lidar/scan

# Configuration for the integrated `imu` Gazebo plugin.
front_top_lidar_imu:
  enabled: true
  use_gravity: true
  always_on: true
  update_rate: 100.0
  ang_vel_gaussian_noise:
    mean_x: 0.0
    stddev_x: 0.0002
    mean_y: 0.0
    stddev_y: 0.0002
    mean_z: 0.0
    stddev_z: 0.0002
  ang_vel_gaussian_noise_bias:
    mean_x: 0.0000075
    stddev_x: 8e-7
    mean_y: 0.0000075
    stddev_y: 8e-7
    mean_z: 0.0000075
    stddev_z: 8e-7
  ang_vel_gaussian_noise_dynamic_bias:
    stddev_x: 0.0
    corr_time_x: 0.0
    stddev_y: 0.0
    corr_time_y: 0.0
    stddev_z: 0.0
    corr_time_z: 0.0
  lin_acc_gaussian_noise:
    mean_x: 0.0
    stddev_x: 0.017
    mean_y: 0.0
    stddev_y: 0.017
    mean_z: 0.0
    stddev_z: 0.017
  lin_acc_gaussian_noise_bias:
    mean_x: 0.1
    stddev_x: 0.001
    mean_y: 0.1
    stddev_y: 0.001
    mean_z: 0.1
    stddev_z: 0.001
  lin_acc_gaussian_noise_dynamic_bias:
    stddev_x: 0.0
    corr_time_x: 0.0
    stddev_y: 0.0
    corr_time_y: 0.0
    stddev_z: 0.0
    corr_time_z: 0.0
  use_orientation: true
  topic: front_top_lidar/imu/data # published

################################################################################
# Front bottom LiDAR is a Sick S300.
################################################################################
front_bottom_lidar:
  enabled: true
  use_gravity: true
  always_on: true
  visualize: false
  update_rate: 25.0
  hor_fov_deg: {"min_angle": -135, "max_angle": 135}
  hor_res_deg: 0.5
  dist_span: {"min_dist": 0.1, "max_dist": 30.0}   # m
  gaussian_noise: {"mean": 0, "stddev": 0.01}
  topic: front_bottom_lidar/scan

################################################################################
# Back top LiDAR is a Robosense Airy with integrated IMU.
################################################################################
